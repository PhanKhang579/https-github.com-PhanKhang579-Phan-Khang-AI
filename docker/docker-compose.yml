# Chay: cd docker && cp .env.example .env && (sua mat khau) && docker compose up -d --build
# Mo http://localhost:${HTTP_PORT:-8080}  ->  Administrator / ADMIN_PASSWORD
x-common: &common
  image: omigos-erp:v15
  pull_policy: never
  networks: [frappe_network]
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

x-redis-env: &redis-env
  FRAPPE_REDIS_CACHE: redis://redis-cache:6379
  FRAPPE_REDIS_QUEUE: redis://redis-queue:6379

services:
  db:
    image: mariadb:10.6
    networks: [frappe_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 12
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Hay dat DB_ROOT_PASSWORD trong docker/.env}
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:6.2-alpine
    networks: [frappe_network]
    restart: unless-stopped

  redis-queue:
    image: redis:6.2-alpine
    networks: [frappe_network]
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  # Dich vu duy nhat co "build"; cac dich vu khac dung cung anh omigos-erp:v15.
  configurator:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache redis://redis-cache:6379;
        bench set-config -g redis_queue redis://redis-queue:6379;
        bench set-config -g redis_socketio redis://redis-queue:6379;
        bench set-config -gp socketio_port 9000;
    depends_on:
      db:
        condition: service_healthy

  create-site:
    <<: *common
    restart: "no"
    entrypoint: ["bash", "-c"]
    environment:
      SITE_NAME: ${SITE_NAME:-erp.localhost}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Hay dat ADMIN_PASSWORD trong docker/.env}
    command:
      - >
        wait-for-it -t 120 db:3306;
        if [ -d "sites/$$SITE_NAME" ]; then
          echo "Site $$SITE_NAME da ton tai, chay migrate";
          bench --site $$SITE_NAME migrate;
        else
          bench new-site --mariadb-user-host-login-scope='%' --admin-password=$$ADMIN_PASSWORD
            --db-root-username=root --db-root-password=$$DB_ROOT_PASSWORD
            --install-app erpnext --install-app omigos_erp --set-default $$SITE_NAME;
        fi
    depends_on:
      configurator:
        condition: service_completed_successfully

  backend:
    <<: *common
    environment: *redis-env
    depends_on:
      create-site:
        condition: service_completed_successfully

  websocket:
    <<: *common
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment: *redis-env
    depends_on:
      create-site:
        condition: service_completed_successfully

  frontend:
    <<: *common
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-erp.localhost}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on: [backend, websocket]

  # Worker nen: bat buoc, de tinh lai gia tri ton kho va gui email/tac vu nen.
  queue-short:
    <<: *common
    command: ["bench", "worker", "--queue", "short,default"]
    environment: *redis-env
    depends_on:
      create-site:
        condition: service_completed_successfully

  queue-long:
    <<: *common
    command: ["bench", "worker", "--queue", "long,default,short"]
    environment: *redis-env
    depends_on:
      create-site:
        condition: service_completed_successfully

  scheduler:
    <<: *common
    command: ["bench", "schedule"]
    environment: *redis-env
    depends_on:
      create-site:
        condition: service_completed_successfully

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:

networks:
  frappe_network:
    driver: bridge
